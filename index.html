<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>اختبار إلكتروني - الجهاز المركزي</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .english-text {
        direction: ltr;
        text-align: left;
      }

      body {
        font-family: "Cairo", Arial, sans-serif;
        direction: rtl;
        font-weight: 700;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        background-color: #f0f4f8;
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .hidden {
        display: none !important;
      }

      .card {
        background: #ffffff;
        width: 100%;
        max-width: 600px;
        margin: 10px auto;
        padding: 18px;
        text-align: center;
        position: relative;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      label {
        display: block;
        font-size: 15px;
        color: #333;
        margin-bottom: 8px;
        text-align: right;
      }

      input[type="number"],
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        outline: none;
        transition: border-color 0.3s;
        -webkit-appearance: none;
        background-color: #fff;
        font-family: "Cairo", Arial, sans-serif;
        font-weight: 700;
      }

      input[type="number"]:focus,
      select:focus {
        border-color: #007bff;
      }

      .btn {
        width: 100%;
        background: linear-gradient(135deg, #007bff, #0056b3);
        color: white;
        padding: 14px 0;
        font-size: 17px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.2s,
          opacity 0.3s;
        margin-top: 10px;
        display: inline-block;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        -webkit-tap-highlight-color: transparent;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-study {
        background: linear-gradient(135deg, #28a745, #218838);
        display: flex;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
      }

      .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 15px;
        border: 1px solid #e2e8f0;
        flex-wrap: wrap;
        gap: 8px;
      }

      #timer {
        font-size: 16px;
        color: #dc3545;
        font-weight: 800;
        background: #fff5f5;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid #feb2b2;
      }

      .section-badge {
        background-color: #007bff;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
      }

      .option-label {
        display: flex;
        align-items: center;
        background-color: #f8fafc;
        border: 2px solid #e2e8f0;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        text-align: right;
        font-size: 15px;
        transition: all 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .option-label input[type="radio"] {
        margin-left: 12px;
        width: 18px;
        height: 18px;
        accent-color: #007bff;
      }

      .option-label:active {
        background-color: #edf2f7;
      }

      .correct-answer {
        color: #28a745;
        font-weight: 900;
      }

      .wrong-answer {
        color: #dc3545;
        font-weight: 900;
      }

      ul {
        list-style-type: none;
        padding: 0;
        text-align: right;
      }

      ul li {
        margin-bottom: 12px;
        background-color: #f8f9fa;
        padding: 12px;
        border: 1px solid #dee2e6;
        border-radius: 10px;
        font-weight: 700;
        color: #000;
        font-size: 14px;
        line-height: 1.5;
      }

      .result-box {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 12px;
        text-align: right;
      }

      .result-box h3 {
        margin-top: 0;
        color: #007bff;
        font-size: 17px;
      }

      .status-text {
        font-size: 15px;
        font-weight: bold;
        display: inline-block;
        margin-top: 5px;
      }

      .motivation-quote {
        background-color: #fffdf0;
        color: #856404;
        border: 1px dashed #ffeeba;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        margin: 12px 0;
        line-height: 1.6;
      }

      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 10px 0;
      }

      .logo-container img {
        width: 75px;
        height: 75px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #007bff;
        margin-bottom: 6px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .logo-container h2 {
        margin: 0;
        text-align: center;
        font-size: 20px;
        color: #333;
      }

      #question-info {
        text-align: right;
        font-size: 13px;
        color: #64748b;
        margin-bottom: 6px;
        font-weight: bold;
      }

      #question-container h3 {
        font-size: 16px !important;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <img
        src="photo_2026-08-03_15-09-55.jpg"
        alt="قناة أسئلة الجهاز المركزي"
      />
      <h2>أسئلة الجهاز المركزي</h2>
    </div>

    <!-- شاشة التسجيل المدمجة (اختيار المسابقة والوقت) -->
    <div id="login-container" class="card">
      <label for="competition-select">🎯 اختر المسابقة التابع لها:</label>
      <select id="competition-select">
        <option value="" disabled selected hidden>
          -- اختر المسابقة من هنا --
        </option>
        <option value="imam">مسابقة إمام وخطيب</option>
        <option value="teachers">مسابقة الحصة / عربي</option>
        <option value="azhar_arabic">مسابقة الأزهر عربي</option>
        <option value="azhar_quran">مسابقة الأزهر قرآن</option>
      </select>
      <label for="duration">⏳ مدة كل قسم (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button class="btn" onclick="startQuiz()">🚀 دخول والاختبار</button>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz" class="card hidden">
      <div class="quiz-header">
        <span id="section-title" class="section-badge"
          >قسم المعلومات العامة</span
        >
        <div id="timer">05:00</div>
      </div>
      <div id="question-info">السؤال 1</div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button
          id="next-button"
          class="btn"
          onclick="nextQuestion(event)"
          type="button"
        >
          التالي ➔
        </button>
      </form>
    </div>

    <!-- شاشة الانتقال بين الأقسام -->
    <div id="transition-container" class="card hidden">
      <div id="motivation-text" class="motivation-quote"></div>
      <button id="transition-btn" class="btn" onclick="startNextSection()">
        🚀 ابدأ القسم التالي
      </button>
    </div>

    <!-- شاشة النتيجة النهائية -->
    <div id="result" class="card hidden"></div>

    <script>

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function getRandomQuestions(sourceArray, count) {
        let arrayCopy = JSON.parse(JSON.stringify(sourceArray));
        shuffle(arrayCopy);
        let selected = arrayCopy.slice(0, count);
        selected.forEach((q) => shuffle(q.options));
        return selected;

          return;

        if (selectedCompetition === "teachers") {
          sectionsOrder = allMasterSections.filter(

          selectedCompetition === "experts"

        } else {
          sectionsOrder = [...allMasterSections];

        sectionScores = {};
        userAnswers = {};
        sectionsOrder.forEach((sec) => {
          sectionScores[sec.id] = 0;
          userAnswers[sec.id] = [];
        });

        availableQuotes = [...originalMotivationQuotes];
        shuffle(availableQuotes);

        sectionsOrder.forEach((sec) => {
          selectedQuestions[sec.id] = getRandomQuestions(
            sec.data,
            QUESTIONS_PER_SECTION,
          );
        });

        currentSectionIndex = 0;
        startSection(currentSectionIndex);

      function startSection(index) {

        sectionScores[sec.id] = 0;
        userAnswers[sec.id] = [];

        document.getElementById("section-title").textContent = sec.title;
        document.getElementById("quiz").classList.remove("hidden");

        loadQuestion();
        startTimer();
      }

      function showTransition() {
        clearInterval(timer);

        const currentQuote = availableQuotes.pop();
        document.getElementById("motivation-text").innerHTML = currentQuote;

        document

      function startNextSection() {

      function loadQuestion() {
        const q = currentQuestionsList[currentQuestionIndex];
        const questionContainer = document.getElementById("question-container");

        const isEnglish = /^[A-Za-z]/.test(q.question);

        questionContainer.innerHTML = `
          <h3 style="text-align: ${isEnglish ? "left" : "right"}; color: #1e293b; margin-bottom: 15px;" class="${isEnglish ? "english-text" : ""}">${q.question}</h3>
          ${q.options
            .map(
              (option) => `
            <label class="option-label" style="direction: ${/^[A-Za-z]/.test(option) ? "ltr" : "rtl"}; justify-content: ${/^[A-Za-z]/.test(option) ? "flex-start" : "flex-right"};">
              <input type="radio" name="option" value="${option}" style="${/^[A-Za-z]/.test(option) ? "margin-left: 0; margin-right: 12px;" : ""}" />
              <span style="width: 100%; text-align: ${/^[A-Za-z]/.test(option) ? "left" : "right"};">${option}</span>
            </label>
          `,
            )
            .join("")}
        `;

        document.getElementById("question-info").textContent =
          `السؤال ${currentQuestionIndex + 1} من ${currentQuestionsList.length}`;
      }

      function nextQuestion(event) {
        if (event) event.preventDefault();

        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected)
          return alert("رايحة على فين يا حجة؟ طب اختاري إجابة الأول! 🤭");

        const secId = sectionsOrder[currentSectionIndex].id;
        const answerValue = selected.value;
        const isCorrect =
          answerValue === currentQuestionsList[currentQuestionIndex].answer;

        userAnswers[secId][currentQuestionIndex] = answerValue;
        if (isCorrect) sectionScores[secId]++;

        currentQuestionIndex++;

        if (currentQuestionIndex < currentQuestionsList.length) {
          loadQuestion();
        } else {
          if (currentSectionIndex < sectionsOrder.length - 1) {
            showTransition();
          } else {
            clearInterval(timer);
            showFinalResults();
          }
        }
      }

      function startTimer() {
        clearInterval(timer);

        timer = setInterval(() => {

          `<span class="status-text" style="color: #d97706;">عايزة تشتري كل اللي نفسك فيه؟ يبقى نذاكر اكتر ونشد حلنا</span>`,
          `<span class="status-text" style="color: #d97706;">عايزة الفلوس؟ ذاكري. عايزة التعيين؟ ذاكري أكتر. عايزة الاتنين؟ متناميش 😂😂</span>`,
          `<span class="status-text" style="color: #d97706;">نذاكر اكتر علشان يبقى معانا فلوس ونشتري الشنطة الجلد الجديدة</span>`,
          `<span class="status-text" style="color: #d97706;">فاكرة الحاجات اللي أجلتيها عشان الفلوس؟ شدّي حيلك عشان نعوضها كلها 😂</span>`,
          `<span class="status-text" style="color: #d97706;">تخيلي نفسك قبضتي أول مرتب وبتشتري اللي نفسك فيه… كمّلي مذاكرة بقى 😂</span>`,
          `<span class="status-text" style="color: #d97706;">أول مرتب مش حلم بعيد، بس محتاج شوية مذاكرة وشوية شد حيل 😂</span>`,
          `<span class="status-text" style="color: #d97706;">شدّي حيلك دلوقتي، عشان بعد الشغل مفيش حاجة تقولي عليها غالية 😂</span>`,
          `<span class="status-text" style="color: #d97706;">كل ما tكسلي افتكري أول مرتب والحاجات اللي نفسك تشتريها 😂</span>`,
          `<span class="status-text" style="color: #d97706;">يلا نرفع الدرجات عشان نشتغل 😂❤️</span>`,
          `<span class="status-text" style="color: #d97706;">المذاكرة النهارده، والمرتب الحلو بكرة… اتفقنا؟ 😂</span>`,
          `<span class="status-text" style="color: #d97706;">سمعتي كام مرة مش معايا فلوس يلا نذاكر بقى ونشتغل</span>`,
          `<span class="status-text" style="color: #d97706;">تخيلي كده الشنطة جلد طبيعي وفيها فلوس كتير</span>`,
          `<span class="status-text" style="color: #d97706;">تخيلي كده أول مرتب متحطوط في شنطة شيك… يستاهل المذاكرة 😂❤️</span>`,
          `<span class="status-text" style="color: #d97706;">يلا نذاكر علشان نغيظ الصفرة بالتعيين</span>`,
          `<span class="status-text" style="color: #d97706;">خليكي شاطرة، أصل في ناس نجاحك بيعملها ضغط نفسي 😂</span>`,
          `<span class="status-text" style="color: #d97706;">لازم نذاكر وننجح، عشان فيه ناس لازم نفرحها وناس تانية نوجع بطنها 😂</span>`,
          `<span class="status-text" style="color: #d97706;">كل درجة زيادة هتفرّح حد وتحرق دم حد تاني 😂❤️</span>`,
        ];

        const lowRatings = [
          `<span class="status-text" style="color: red;">الدرجة دي اكيد تجربة ولا هنثبت عليها؟ 😂 روح ذاكر الاول وبعدين تعالى قفل الامتحان</span>`,
          `<span class="status-text" style="color: red;">المهم إن الامتحان تجريبي، عشان النتيجة دي مينفعش تتكرر 😂 تك ضربة روجي ذاكري</span>`,
          `<span class="status-text" style="color: red;">دي درجة تضحك 😂 روحي ذاكري وحلي كويس تك حل وسطك</span>`,
          `<span class="status-text" style="color: red;">😂😂😂 انتي كده دخلتي تعملي إيه بالظبط؟</span>`,
          `<span class="status-text" style="color: red;">معلش المهم إننا عرفنا الغلط فين… في كل حتة تقريبًا 😂 تك صروح فودانك روحي ذاكري</span>`,
          `<span class="status-text" style="color: red;">واضح إنك كنتي بتجاوبي حسب الإحساس 😂 روحي لمّي نفسك وذاكري</span>`,
          `<span class="status-text" style="color: red;">هو إنتي دخلتي الامتحان على الله ولا إيه 😂 روحي ذاكري وبلاش فضايح</span>`,
          `<span class="status-text" style="color: red;">ده مش هينكتبلك عفوا في النتيجة، دول هيقولولك كحك أورس أورس كحك 😂</span>`,
          `<span class="status-text" style="color: red;">اي النتيجة دي ياشماتت سلفتك فيكي روحي ذكري علشان تغيظي سلفتك بالتعيين😂</span>`,
          `<span class="status-text" style="color: red;">ليه حق حوزك يدغدغ عضمك يام دماغ طخينة روحي ذاكري يا عسل😂</span>`,
          `<span class="status-text" style="color: red;">أهو الدليل وصل، يلا روحي اعملي لقمة كده عشان الغدا 😂</span>`,
          `<span class="status-text" style="color: red;">يا ستي مذاكرة إيه ووجع دماغ إيه 😂 روحي اغسلي طبقين الست مالهاش غير بيت جوزها</span>`,
          `<span class="status-text" style="color: red;">بالنتيجة دي مش هتبقي إندِبِندِنت وومان … هتبقي وومان ترويق مسح كنس 😂 روحي ذاكري علشان يكون معاكي فلوس وتجيبي شغالة</span>`,
        ];

        let selectedList;
        if (percent >= 85) {
          selectedList = highRatings;
        } else if (percent >= 50) {
          selectedList = mediumRatings;
        } else {
          selectedList = lowRatings;
        }

        const randomIndex = Math.floor(Math.random() * selectedList.length);
        return selectedList[randomIndex];
      }

      function showFinalResults(timeUp = false) {
        document.getElementById("quiz").classList.add("hidden");
        const resultDiv = document.getElementById("result");
        resultDiv.classList.remove("hidden");

        let totalQuestions = 0;
        let totalScore = 0;
        let resultsHTML = "";
        let reviewHTML = "<h3 style='text-align: right;'>تفاصيل الإجابات:</h3>";

        sectionsOrder.forEach((sec) => {
          const qList = selectedQuestions[sec.id];
          const score = sectionScores[sec.id];
          const count = qList.length;
          const percent = parseFloat(((score / count) * 100).toFixed(1));

          totalQuestions += count;
          totalScore += score;

          resultsHTML += `
                            <div class="result-box">
                                <h3>📌 ${sec.title}</h3>
                                <p>الدرجة: <strong>${score} من ${count}</strong> (${percent}%)</p>
                                <p>بقولك: ${getRating(percent)}</p>
                            </div>
                            `;

          reviewHTML += `<h4 style="text-align: right; font-size:15px;">📌 ${sec.title}:</h4><ul>`;
          qList.forEach((q, i) => {
            const ua = userAnswers[sec.id][i] || "لم يُجب";
            const isCorrect = ua === q.answer;
            reviewHTML += `
                                <li>
                                  <strong>السؤال ${i + 1}:</strong> ${q.question}<br>
                                  إجابتك: <span class="${isCorrect ? "correct-answer" : "wrong-answer"}">${ua}</span> |
                                  الصحيحة: <span class="correct-answer">${q.answer}</span>
                                  ${q.explanation ? `<br><small style="color: #555;">💡 ${q.explanation}</small>` : ""}
                                </li>`;
          });
          reviewHTML += "</ul>";
        });

        const totalPercent = parseFloat(
          ((totalScore / totalQuestions) * 100).toFixed(1),
        );
        const totalRating = getRating(totalPercent);
        let warningMsg = timeUp
          ? `<p style="color: red;">⏰ انتهى الوقت أثناء الحل.</p>`
          : "";

        resultDiv.innerHTML = `
                            ${warningMsg}
                            <h2>📊 النتيجة النهائية للاختبار</h2>
                            ${resultsHTML}
                            <div class="result-box" style="background-color: #d4edda; border: 1.5px solid #c3e6cb;">
                              <h3 style="color: #155724;">🏆 المجموع الكلي</h3>
                              <p style="color: #155724; font-size: 19px;"><strong>${totalScore} من ${totalQuestions}</strong> (${totalPercent}%)</p>
                              <p>النتيجة العامة: ${totalRating}</p>
                            </div>

                            <!-- الأزرار فوق تفاصيل الإجابات مباشرة -->
                            <a href="http://t.me/NaglaFG" id="telegram-study-btn-top" class="btn btn-study">📚 عايز اذاكر الاول</a>
                            <button class="btn" onclick="location.reload()">🔄 إعادة الاختبار (أسئلة جديدة)</button>

                            ${reviewHTML}

                            <!-- الأزرار تحت تفاصيل الإجابات أيضاً -->
                            <a href="http://t.me/NaglaFG" id="telegram-study-btn-bottom" class="btn btn-study" style="margin-top: 20px;">📚 عايز اذاكر الاول</a>
                            <button class="btn" onclick="location.reload()">🔄 إعادة الاختبار (أسئلة جديدة)</button>
                          `;
      }
    </script>
